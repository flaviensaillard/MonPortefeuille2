name: Appliquer le correctif 1.7.5

# Lancer à la main : onglet « Actions » > « Appliquer le correctif 1.7.5 » > Run workflow.
# Tout est dans ce fichier : le paquet du correctif est écrit en commentaires tout en bas
# (les lignes qui commencent par # suivi de lettres et de chiffres). Rien à créer d'autre.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appliquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Assembler le paquet
        run: |
          set -euo pipefail
          grep -E '^[[:space:]]*#[A-Za-z0-9+/=]{40,}[[:space:]]*$' .github/workflows/APPLIQUER-1.7.5.yml \
            | sed 's/^[[:space:]]*#//' > 1.7.5.b64
          n=$(wc -l < 1.7.5.b64)
          if [ "$n" != "479" ]; then
            echo "::error::Le paquet compte $n lignes au lieu de 479 : le copier-coller est incomplet."
            echo "Ouvre .github/workflows/APPLIQUER-1.7.5.yml dans le dépôt, Ctrl+A, Ctrl+C, puis colle a la place TOUT le texte de la consigne (de la ligne « name: » jusqu'a la derniere ligne, celle qui commence par « # ===== FIN DU PAQUET »)."
            exit 1
          fi
          python3 - <<'PY'
          import base64, hashlib, pathlib, sys
          try:
              brut = base64.b64decode(''.join(pathlib.Path('1.7.5.b64').read_text().split()))
          except Exception as e:
              print(f"::error::Paquet illisible ({e}) : le copier-coller a ete modifie.")
              sys.exit(1)
          if hashlib.sha256(brut).hexdigest() != '7edc1566071d3bd2d2689cf82696cc5cac5f8d8f021bccc1e6528edcbb896d61':
              print("::error::Paquet modifie (empreinte differente) : recopie le fichier depuis la consigne.")
              sys.exit(1)
          pathlib.Path('paquet.tar.xz').write_bytes(brut)
          print(f"Paquet valide ({len(brut)} octets).")
          PY
          mkdir -p paquet175
          tar xf paquet.tar.xz -C paquet175
          echo "Paquet pret."

      - name: Outils de test (facultatif)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pytest \
            || python3 -m pip install --quiet --break-system-packages pytest \
            || echo "pytest non installé : le contrôle Python sera simplement ignoré"

      - name: Appliquer le correctif et vérifier chaque fichier
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash paquet175/appliquer.sh

