# Tests unitaires — MonPortefeuille 2
#
# Ces tests ne touchent jamais le réseau ni Supabase. Ils vérifient la logique
# de calcul, qui est précisément ce que la v1 avait de faux.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: python -m pytest tests/ -v
