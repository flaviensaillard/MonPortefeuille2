# Tests unitaires — MonPortefeuille 2
#
# Ces tests ne touchent jamais le réseau ni Supabase. Ils vérifient la logique
# de calcul, qui est précisément ce que la v1 avait de faux.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: python -m pytest tests/ -v
      # Moteur JavaScript de l'application (comptes, portefeuille, écran) : faux réseau,
      # aucun appel réel. Même code que celui de la WebView.
      - name: Vérifier le moteur JavaScript
        run: |
          node tests/test_js.js
          node tests/test_comptes.js
      # Les règles du service IA (phrase imposée sans passage, citation des
      # sources, indexation sans doublon) se testent en JavaScript, avec un
      # faux Cloudflare : aucun appel réseau réel.
      - name: Vérifier le service IA
        run: node ia/tests/test_worker.mjs
