name: Diagnostic ponctuel PDF crypto DGFiP
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/diagnostic-crypto-pdf.yml']
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les deux documents publics réels (sans activer de taux)
        run: |
          node > diagnostic-public.txt <<'JS'
          const pdfjs=require('./app/src/main/assets/www/vendor/pdfjs/pdf.min.js');
          pdfjs.GlobalWorkerOptions.workerSrc=require.resolve('./app/src/main/assets/www/vendor/pdfjs/pdf.worker.min.js');
          require('./app/src/main/assets/www/js/fiscal_crypto_pdf_sources.js');
          const reader=globalThis.PF.fiscalCryptoPdfSources;
          const urls=reader.urls;
          (async()=>{
            for(const type of ['notice','brochure']){
              const r=await fetch(urls[type],{headers:{'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/122.0.0.0 Mobile Safari/537.36',Accept:'application/pdf'},redirect:'manual'});
              console.log(type,'HTTP',r.status,r.headers.get('content-type'));
              if(r.status!==200) continue;
              const data=new Uint8Array(await r.arrayBuffer());
              console.log(type,'octets',data.length,'signature',Buffer.from(data.slice(0,5)).toString('ascii'));
              if(data.length>2*1024*1024)continue;
              const d=await pdfjs.getDocument({data,isEvalSupported:false,useSystemFonts:true}).promise;
              const pages=[];
              for(let i=1;i<=d.numPages;i++){
                const p=await d.getPage(i),c=await p.getTextContent();
                pages.push(c.items.map(x=>x.str).join(' '));
              }
              await d.destroy();
              console.log(type,'pages',pages.length);
              const a=type==='notice'?reader.analyserNotice(pages):reader.analyserBrochure(pages);
              console.log(type,'analyse',JSON.stringify({etat:a.etat,valeurs:a.valeurs||null}));
              const t=pages.join(' ').replace(/\s+/g,' ');
              for(const motif of (type==='notice'?[/realisees en 2025/i,/51 total/i,/premier terme/i,/inferieur ou egal a 305/i,/3CN/i]:[/cession d.actifs numeriques/i,/en 2025/i,/12,8/i,/option expresse/i])){
                const i=t.search(motif);
                console.log(type,'repère',String(motif),i,JSON.stringify(t.slice(Math.max(0,i-40),Math.max(0,i-40)+450)));
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          # 10 annotations max ; tout le texte est public DGFiP, aucun compte.
          head -n 10 diagnostic-public.txt | while IFS= read -r ligne; do
            echo "::warning::${ligne:0:950}"
          done
