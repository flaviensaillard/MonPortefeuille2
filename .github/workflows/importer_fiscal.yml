# Reprise des barèmes intégrés à la 2.2.1 ; PAS une veille officielle.
# PRÉREQUIS manuel : appliquer 009 puis 010 dans l'éditeur SQL de Supabase.
# Toujours lancer d'abord en simulation et lire le résultat.
name: Reprendre les millésimes fiscaux existants

on:
  # Temporaire : une simulation strictement en lecture seule sur cette branche.
  # Supprimer ce déclencheur après lecture du rapport, AVANT tout merge.
  push:
    branches: [arena/4e8a2b4d-monportefeuille2]
  workflow_dispatch:
    inputs:
      appliquer:
        description: 'Écrire les années absentes ? Non = simulation en lecture seule'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write # uniquement pour publier le résultat non sensible de simulation

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Reprise idempotente par année, sans remplacer les années existantes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          APPLIQUER: ${{ inputs.appliquer }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$APPLIQUER" = "true" ]; then
            python jobs/importer_fiscal_existant.py --appliquer
          else
            python jobs/importer_fiscal_existant.py --dry-run | tee /tmp/rapport-fiscal.txt
          fi
      - name: Publier seulement les années proposées dans la PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Simulation fiscale en lecture seule — AUCUNE année insérée :'
            echo '```'
            cat /tmp/rapport-fiscal.txt
            echo '```'
          } > /tmp/commentaire-fiscal.txt
          gh pr comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/commentaire-fiscal.txt
