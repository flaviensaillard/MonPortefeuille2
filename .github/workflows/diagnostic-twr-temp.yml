# TEMPORAIRE — lecture seule de la table v1 `Projections` (aucune écriture en base).
# Sortie : CSV committé ; aucune valeur n'est affichée dans les journaux Actions.
# Retiré de la branche après lecture.
name: Diagnostic TWR (temporaire)

on:
  push:
    branches:
      - arena/25fcff0b-monportefeuille2
    paths:
      - '.github/workflows/diagnostic-twr-temp.yml'

concurrency:
  group: diagnostic-twr-temp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Export lecture seule de Projections (v1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set +e
          mkdir -p donnees-reconstituees/diagnostic-twr
          cat > /tmp/export_v1.py <<'PY'
          import csv, os, sys
          sys.path.insert(0, os.getcwd())
          from core import db
          out = os.path.join(os.getcwd(), "donnees-reconstituees", "diagnostic-twr", "projections_v1.csv")
          rows, debut = [], 0
          while True:
              page = db.client().table("Projections").select("*").range(debut, debut + 999).execute().data or []
              rows.extend(page)
              if len(page) < 1000:
                  break
              debut += 1000
          cols = []
          for r in rows:
              for k in r:
                  if k not in cols:
                      cols.append(k)
          with open(out, "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=cols)
              w.writeheader()
              w.writerows(rows)
          print("lignes exportees:", len(rows), "colonnes:", len(cols))
          PY
          python /tmp/export_v1.py > /tmp/journal.txt 2>&1
          RC=$?
          sed -e "s#$SUPABASE_KEY#<CLE>#g" -e "s#$SUPABASE_URL#<URL>#g" /tmp/journal.txt > donnees-reconstituees/diagnostic-twr/journal.txt
          echo "$RC" > donnees-reconstituees/diagnostic-twr/code_retour.txt
          # Anti-secret avant publication
          if grep -rqF -- "$SUPABASE_KEY" donnees-reconstituees/ || grep -rqF -- "$SUPABASE_URL" donnees-reconstituees/; then
            echo "ECHEC : secret détecté ; rien publié."; rm -f donnees-reconstituees/diagnostic-twr/*.csv; exit 1
          fi
          echo "anti-secret OK (code retour : $RC)"
          set -e
          test "$RC" = "0"

      - name: Publication (branche de travail uniquement)
        if: always()
        run: |
          git config user.name "arena-diagnostic"
          git config user.email "arena-diagnostic@users.noreply.github.com"
          git add -f donnees-reconstituees/diagnostic-twr/
          if git diff --cached --quiet; then echo "rien à publier"; exit 0; fi
          git commit -qm "Diagnostic TWR temporaire : export lecture seule de Projections"
          git push -q origin HEAD:arena/25fcff0b-monportefeuille2
