# Robots quotidiens — MonPortefeuille 2
#
# Chaque soir :
#   21h05 UTC — cours et taux de change
#   21h35 UTC — snapshot du portefeuille (en onces d'or)
#   22h05 UTC — inflation annuelle
#   22h35 UTC — alertes fiscales
#
# Secrets à définir dans Settings > Secrets and variables > Actions du repo :
#   SUPABASE_URL      URL du projet Supabase.
#   SUPABASE_KEY      clé SERVICE_ROLE du projet (Project Settings > API). C'est un
#                     secret de serveur : elle contourne la RLS. Ne la mettez jamais
#                     dans l'application Android ni dans le dépôt.
#   SUPABASE_USER_ID  uid de VOTRE compte Supabase (Authentication > Users > colonne
#                     User UID). Sans lui, la base refuse chaque ligne écrite (ligne
#                     sans propriétaire) : c'est voulu. Voir migrations 004 et 008.
#
# Rotation des clés et procédure de révocation : docs/SECURITE-LIVRAISON.md.
#
# ATTENTION SÉCURITÉ : la v1 commitait ses credentials Supabase en dur dans
# take_snapshot.py et calc_perf.py, sur un repo public. Révoquez ces anciennes
# clés et n'utilisez que les secrets GitHub ci-dessus.

name: Robots quotidiens

on:
  schedule:
    - cron: '35 21 * * *'   # chaque soir à 21h35 UTC (market-data -> snapshot -> alertes, et inflation)
  workflow_dispatch:

jobs:
  market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Cours et taux de change
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python jobs/update_market_data.py

  snapshot:
    needs: market-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Snapshot du portefeuille
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python jobs/daily_snapshot.py

  inflation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inflation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python jobs/update_inflation.py

  alertes:
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Alertes fiscales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python jobs/fiscal_alerts.py
