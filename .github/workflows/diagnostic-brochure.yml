name: Diagnostic ponctuel brochure DGFiP
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/diagnostic-brochure.yml']
permissions:
  contents: read
jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extraire des repères publics du PDF sans activer de règle
        run: |
          node <<'JS'
          const pdfjs = require('./app/src/main/assets/www/vendor/pdfjs/pdf.min.js');
          pdfjs.GlobalWorkerOptions.workerSrc = require.resolve('./app/src/main/assets/www/vendor/pdfjs/pdf.worker.min.js');
          const url = 'https://www.impots.gouv.fr/www2/fichiers/documentation/brochure/ir_2026/pdf_som/nouveautes.pdf';
          (async () => {
            const rep = await fetch(url, {headers: {'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/122.0.0.0 Mobile Safari/537.36',Accept:'application/pdf'},redirect:'manual'});
            console.log('HTTP', rep.status, 'content-type', rep.headers.get('content-type'));
            if (rep.status !== 200) return;
            const b = new Uint8Array(await rep.arrayBuffer());
            console.log('Octets', b.length, 'signature', Buffer.from(b.slice(0,5)).toString('ascii'));
            const doc = await pdfjs.getDocument({data:b,isEvalSupported:false,useSystemFonts:true}).promise;
            console.log('Pages', doc.numPages);
            for (let n=1;n<=Math.min(doc.numPages,20);n++) {
              const p=await doc.getPage(n), c=await p.getTextContent();
              const t=c.items.map(i=>i.str).join(' ').replace(/\s+/g,' ');
              const ix=t.search(/nouv|2025|prelev|patrimoine|CSG/i);
              console.log('Page',n,'items',c.items.length,'début',JSON.stringify(t.slice(0,450)));
              console.log('Page',n,'premier repère',ix,JSON.stringify(t.slice(Math.max(0,ix-40),Math.max(0,ix-40)+700)));
            }
            await doc.destroy();
          })().catch(e => {console.error(e);process.exitCode=1});
          JS
