# Diagnostic — à lancer quand un chiffre ne colle pas.
#
# Allez dans l'onglet Actions du repo → « Diagnostic » → Run workflow.
# Le rapport s'affiche dans le journal. Il ne modifie RIEN : lecture seule.
#
# Il répond à trois questions que le code seul ne peut pas trancher, parce
# qu'elles dépendent des données :
#   1. Depuis quand mon historique remonte-t-il, et pourquoi pas plus loin ?
#   2. Mes apports sont-ils enregistrés avec leur vrai montant ?
#   3. Que contient la table d'inflation ?
#   4. (2.2.0) Pour chaque apport des 3 dernières années : quelle valorisation
#      le TWR a-t-il utilisée (mesurée, reconstruite depuis le snapshot précédent,
#      ou manquante), quel snapshot a été retenu, et le TWR global qui en découle.
#
# À la fin du journal, une section VERDICT dit quoi faire.

name: Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Diagnostic du portefeuille
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python jobs/diagnostic.py
