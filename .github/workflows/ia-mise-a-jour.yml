name: Mise à jour du corpus IA

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le collecteur public
        run: pip install -r ia/scripts/requirements.txt
      - name: Récupérer les nouveaux articles publics de l'IDL
        run: python ia/scripts/collecter_idl.py --recents 400
      - name: Récupérer les sous-titres de 40 vidéos publiques par chaîne
        run: python ia/scripts/collecter_youtube.py --limite 40
      - name: Reconstruire les passages
        run: python ia/scripts/fabriquer_chunks.py
      - name: Indexer une tranche compatible avec le quota gratuit
        env:
          UDE_URL: ${{ secrets.UDE_URL }}
          UDE_CLE_ADMIN: ${{ secrets.UDE_CLE_ADMIN }}
        run: python ia/scripts/indexer.py --tranche 1800 --taille 50
      - name: Mémoriser le point de reprise et les nouvelles sources
        run: |
          git config user.name "ude-corpus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ia/corpus ia/scripts
          git diff --cached --quiet || git commit -m "Corpus : mise à jour automatique"
          git push
